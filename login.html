<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Splitter - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1 class="login-title">Expense Splitter</h1>
                <p class="login-subtitle">Manage your shared expenses effortlessly</p>
            </div>

            <!-- Tabs -->
            <div class="form-tabs">
                <button class="tab-button active" id="signin-tab" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-button" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <div class="form-content active" id="signin-form">
                <form onsubmit="handleSignIn(event)">
                    <div class="form-group">
                        <label class="form-label" for="signin-username">Username</label>
                        <input type="text" id="signin-username" class="form-input" placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signin-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signin-password" class="form-input"
                                placeholder="Enter your password" style="padding-right: 40px;">
                            <button type="button" class="password-toggle"
                                onclick="togglePassword('signin-password', this)">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                    </path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="submit-button">Sign In</button>
                </form>
                <div class="form-footer">
                    Don't have an account? <a href="#" onclick="switchTab('signup')"
                        style="color: var(--primary-color);">Sign up</a>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div class="form-content" id="signup-form">
                <form onsubmit="handleSignUp(event)">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <div class="name-row">
                            <input type="text" id="signup-firstname" class="form-input" placeholder="First name">
                            <input type="text" id="signup-lastname" class="form-input" placeholder="Last name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signup-username">Username</label>
                        <input type="text" id="signup-username" class="form-input" placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signup-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" class="form-input"
                                placeholder="Create a password" style="padding-right: 40px;">
                            <button type="button" class="password-toggle"
                                onclick="togglePassword('signup-password', this)">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                    </path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="submit-button">Create Account</button>
                </form>
                <div class="form-footer">
                    Already have an account? <a href="#" onclick="switchTab('signin')"
                        style="color: var(--primary-color);">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
</body>

</html>
