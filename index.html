<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Splitter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <header>
            <h1>Expense Splitter</h1>
            <div class="trip-selector">
                <div id="trip-select-container" style="display: flex; gap: 12px;">
                    <select id="trip-select">
                        <option value="" disabled selected>Select a trip...</option>
                    </select>
                    <div class="trip-actions-header" style="display: flex; gap: 8px;">
                        <button id="mark-completed-btn" class="secondary" title="Mark as Completed"
                            style="padding: 10px; display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </button>
                        <button id="delete-trip-btn" class="danger" title="Delete Trip"
                            style="padding: 10px; display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2">
                                </path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                    <button id="new-trip-btn" class="secondary">+ New Trip</button>
                </div>
                <div id="new-trip-form" style="display: none; gap: 8px;">
                    <input type="text" id="new-trip-name" placeholder="Trip Name">
                    <button id="save-trip-btn">Save</button>
                    <button id="cancel-trip-btn" class="secondary">Cancel</button>
                </div>
            </div>
        </header>

        <div class="main-grid">
            <!-- Left Column: Actions -->
            <div class="left-col">
                <div class="form-group">
                    <div class="section-title">Add Member</div>
                    <div class="form-row">
                        <input type="text" id="new-member-name" placeholder="Member Name">
                        <button id="add-member-btn" class="secondary">Add</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="section-title">Add Expense</div>
                    <input type="text" id="expense-desc" placeholder="Description (e.g. Dinner)"
                        style="width: 100%; margin-bottom: 10px;">
                    <div class="form-row">
                        <input type="number" id="expense-amount" placeholder="Amount">
                        <select id="expense-payer" style="flex: 1;">
                            <option value="" disabled selected>Paid by...</option>
                        </select>
                    </div>
                    <div class="beneficiaries-box">
                        <div
                            style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <span>Split with:</span>
                            <div class="split-method-toggle" style="display: flex; gap: 10px; font-size: 0.8rem;">
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                                    <input type="radio" name="split-method" value="equal" checked> Equal
                                </label>
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                                    <input type="radio" name="split-method" value="manual"> Manual
                                </label>
                            </div>
                        </div>
                        <div id="expense-beneficiaries" class="checkbox-group">
                            <!-- Checkboxes will be injected here -->
                        </div>
                    </div>
                    <button id="add-expense-btn" style="width: 100%;">Add Expense</button>
                </div>

                <!-- Settlements Section -->
                <div class="settlements-container">
                    <div class="section-title" style="margin-bottom: 10px;">Who Owes Whom</div>
                    <div id="settlements-list">
                        <!-- Settlements will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Data -->
            <div class="right-col">
                <div class="summary-grid">
                    <div class="summary-card" style="grid-column: span 2;">
                        <div class="section-title" style="margin-bottom: 5px;">Total Spending</div>
                        <div id="total-spending" class="summary-value">₹0</div>

                        <!-- Individual Spending Section - Below Total Spending -->
                        <div class="individual-spending-section">
                            <div class="section-title" style="margin-bottom: 10px;">Individual Spending</div>
                            <div id="member-spending-grid" class="member-spending-grid">
                                <!-- Member spending cards will be injected here -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Recent Expenses</div>
                <div id="expenses-list" class="expenses-list-container">
                    <!-- Expenses will be injected here -->
                </div>

                <div class="section-title" style="margin-top: 40px;">Members</div>
                <div id="members-list">
                    <!-- Members list will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
